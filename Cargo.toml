[package]
name = "racpagent"
version = "0.1.0"
edition = "2024"

[workspace]
members = [""]

[dependencies]
ambassador = "0.5.1"
anyhow = "1.0.102"
async-openai = { version = "0.41.1", features = ["chat-completion"] }
async-stream = "0.3.6"
async-trait = "0.1"
backon = "1.6.0"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.32"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = "2"
libc = "0.2"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
encoding_rs = "0.8"
ignore = "0.4"
regex = "1"
glob = "0.3"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
llm = { path = "src/llm" }
racpagent-macros = { path = "src/racpagent-macros" }
